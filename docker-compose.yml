version: "3.9"

services:

  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: phishguard_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: phishing_detector
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask backend ──────────────────────────────────────────────
  backend:
    build: .
    container_name: phishguard_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: phishing_detector
      FLASK_DEBUG: "0"
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      # Persist SQLite DB in case Mongo is disabled
      - sqlite_data:/app/backend

  # ── Nginx static frontend ──────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: phishguard_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  sqlite_data:
